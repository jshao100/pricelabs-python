[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pricelabs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.0",
]
license = "MIT"
description = "Python client for the PriceLabs Customer API"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
1password = ["onepassword-sdk>=0.3"]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "pyright",
]

[project.urls]
Homepage = "https://github.com/pricelabs-python/pricelabs-python"
Issues = "https://github.com/pricelabs-python/pricelabs-python/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pricelabs"]

[tool.coverage.report]
show_missing = true
